public_task_rules: 'Public task rules (static requirements, not current-state measurements):

  There is one active object in this episode. The fixed class mapping is:

  rough object -> orange goal region; plain/smooth object -> green goal region.

  Success requires the active object''s pose origin, expressed in its correct

  class goal reference frame, to satisfy |x| < 0.02 m, |y| < 0.02 m and

  |z| < 0.01 m simultaneously. The dot product of the object''s positive

  longitudinal axis and that goal''s positive axis must be greater than 0.965.

  The goal reference frame defines the placement position and direction; its

  true transform and the current object''s class are not supplied. These are

  object-relative placement requirements, not TCP displacement or finger opening.

  No task-specific wrong-goal early stop is added: exploration and multiple

  attempts are allowed within the shared native and tool budgets.

  A false check_task result alone does not mean the episode has terminated;

  use terminal feedback to determine whether physical interaction can continue.'
