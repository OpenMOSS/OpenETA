public_task_rules: |-
  Public task success and termination rules (static requirements, not measurements):
  Success requires all of the following simultaneously:
  - The object's pose origin, expressed in the target reference frame, has
    lateral coordinates with |x| < 0.01 m and |y| < 0.01 m, and axial coordinate
    z < -0.04 m.
  - The dot product of the object's positive longitudinal axis and the target's
    positive axis is greater than 0.99.
  - The absolute change in the object's longitudinal position relative to the
    gripper, measured from the end of official pre_move, is less than 0.04 m.
  If that last grip-relative longitudinal change exceeds 0.04 m, native
  evaluation immediately terminates the episode; further physical recovery in
  that episode is unavailable. At exactly 0.04 m, this quantity neither satisfies
  the strict success requirement nor triggers the strict early-stop condition.
  The target reference frame defines the hole channel's position and direction;
  its true transform for this instance is not supplied. The object's axial
  coordinate is not a TCP downward displacement or a directly measured insertion
  depth. Grip-relative longitudinal change is not finger opening or a tactile
  image-change score. These are static requirements, not current-state values.
  A false check_task result alone does not mean the episode has terminated;
  use the terminal feedback to determine whether interaction can continue.
