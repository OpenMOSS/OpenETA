<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Human VLM Console</title>
<style>
:root{color-scheme:dark;--bg:#090d13;--side:#0d131c;--surface:#121a25;--surface2:#172231;--deep:#0b1119;--line:#263548;--line2:#38506b;--text:#eef4fb;--muted:#91a2b8;--accent:#5fe0ac;--accent2:#174d3d;--blue:#85b8ff;--warn:#ffc46b;--warn2:#4a3518;--bad:#ff8492;--bad2:#4a2028}
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit;color:inherit}.hidden{display:none!important}.app{display:grid;grid-template-columns:318px minmax(0,1fr);height:100vh}.sidebar{display:flex;min-height:0;flex-direction:column;border-right:1px solid var(--line);background:var(--side)}.brand{padding:17px;border-bottom:1px solid var(--line)}.brand-row{display:flex;align-items:center;gap:10px}.logo{display:grid;width:31px;height:31px;place-items:center;border:1px solid #2c8d6e;border-radius:9px;background:var(--accent2);color:var(--accent);font-weight:800}.brand h1{margin:0;font-size:16px}.brand p{margin:5px 0 0 41px;color:var(--muted);font-size:11px}.queue{min-height:0;flex:1;overflow:auto;padding:10px}.session{margin-bottom:10px;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#0a1018}.session>summary{padding:9px 10px;overflow:hidden;color:var(--muted);font:11px ui-monospace,monospace;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}.session-items{padding:0 6px 6px}.request{width:100%;margin:0 0 5px;padding:9px;border:1px solid transparent;border-radius:8px;background:transparent;text-align:left;cursor:pointer}.request:hover{background:var(--surface)}.request.selected{border-color:var(--line2);background:var(--surface2)}.request-top{display:flex;justify-content:space-between;gap:8px}.request-task{margin-top:5px;overflow:hidden;color:#c4d0df;font-size:12px;text-overflow:ellipsis;white-space:nowrap}.request-meta{margin-top:5px;color:var(--muted);font-size:10px}.status-pending{color:var(--warn)}.status-responded{color:var(--accent)}.status-cancelled{color:var(--bad)}
.main{display:grid;min-width:0;min-height:0;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}.topbar{display:flex;min-height:58px;align-items:center;justify-content:space-between;gap:16px;padding:9px 18px;border-bottom:1px solid var(--line);background:#0c121b}.title{overflow:hidden;font-weight:700;text-overflow:ellipsis;white-space:nowrap}.subtitle{margin-top:2px;color:var(--muted);font-size:11px}.top-actions,.view-tabs,.composer-top,.tabs,.badges{display:flex;align-items:center;gap:8px}.view-tabs,.tabs{padding:3px;border:1px solid var(--line);border-radius:9px;background:var(--deep)}.view-tab,.tab{padding:6px 11px;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer}.view-tab.active,.tab.active{background:var(--surface2);color:var(--text)}.raw-link{color:var(--blue);text-decoration:none;font-size:12px}.viewer{min-height:0;overflow:auto;padding:20px}.empty{display:grid;height:100%;place-items:center;color:var(--muted)}.hero{display:flex;max-width:1440px;margin:0 auto 16px;align-items:flex-start;justify-content:space-between;gap:16px}.eyebrow{color:var(--accent);font-size:11px;font-weight:750;letter-spacing:.1em;text-transform:uppercase}.hero h2{margin:5px 0 0;font-size:22px;line-height:1.3}.chip{display:inline-flex;min-height:21px;align-items:center;padding:2px 7px;border:1px solid var(--line2);border-radius:999px;background:var(--deep);color:var(--muted);font-size:10px}.alert{max-width:1440px;margin:0 auto 12px;padding:11px 13px;border:1px solid #79404b;border-radius:9px;background:var(--bad2);color:#ffd1d7}.operate-grid{display:grid;max-width:1440px;margin:0 auto;grid-template-columns:minmax(0,1.5fr) minmax(320px,.8fr);gap:16px;align-items:start}.panel{overflow:hidden;border:1px solid var(--line);border-radius:11px;background:var(--surface)}.panel+.panel{margin-top:16px}.panel-head{padding:10px 13px;border-bottom:1px solid var(--line);font-weight:700}.panel-body{padding:13px}.text-value{white-space:pre-wrap;overflow-wrap:anywhere}.json{margin:0;overflow:auto;white-space:pre-wrap;color:#c8d5e3;font:12px/1.5 ui-monospace,monospace}.image-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.evidence{overflow:hidden;border:1px solid var(--line);border-radius:9px;background:#05080d}.evidence img{display:block;width:100%;height:min(52vh,480px);object-fit:contain;cursor:zoom-in}.caption{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-top:1px solid var(--line);font-size:11px}
.audit{max-width:1440px;margin:auto}.audit-banner{display:grid;gap:5px;margin-bottom:14px;padding:12px 14px;border:1px solid #31557a;border-radius:9px;background:#10233a;color:#cde1ff}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.metric{padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}.metric b{display:block;font-size:20px}.metric span{color:var(--muted);font-size:11px}.message{margin:0 0 14px;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:var(--surface)}.message-head{display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line);color:var(--blue);font-size:11px;text-transform:uppercase}.text-part{max-height:52vh;overflow:auto;padding:13px;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.55 ui-monospace,monospace}.image-part{padding:12px}.image-part img{display:block;max-width:100%;max-height:62vh;cursor:zoom-in}.object-part{margin:0;padding:13px;overflow:auto;white-space:pre-wrap;font:12px/1.5 ui-monospace,monospace}.pager{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px;color:var(--muted)}
.composer{padding:10px 18px;border-top:1px solid var(--line);background:#0e141e;box-shadow:0 -8px 24px #0008}.composer-top{margin-bottom:8px}.mode{color:var(--warn);font-size:11px;font-weight:700}.spacer{flex:1}.btn{padding:7px 11px;border:1px solid var(--line2);border-radius:7px;background:var(--surface2);cursor:pointer}.btn:hover{border-color:#59789d}.btn.primary{border-color:#258b68;background:#146147}.btn.danger{color:#ffc3cb}.raw-response,.form-input,.form-select,.form-textarea{width:100%;border:1px solid var(--line2);border-radius:7px;background:#080d14;padding:8px}.raw-response{height:112px;min-height:80px;max-height:48vh;resize:vertical;font:13px/1.5 ui-monospace,monospace}.composer-body{max-height:46vh;overflow:auto}.tool-picker{display:grid;grid-template-columns:minmax(220px,.45fr) minmax(0,1.55fr);gap:10px}.tool-list{max-height:37vh;overflow:auto;padding:6px;border:1px solid var(--line);border-radius:9px;background:var(--deep)}.tool-button{display:block;width:100%;padding:8px;border:0;border-radius:6px;background:transparent;text-align:left;cursor:pointer}.tool-button:hover,.tool-button.active{background:var(--surface2)}.tool-name{color:var(--blue);font:12px ui-monospace,monospace}.tool-description{color:var(--muted);font-size:11px}.tool-form{padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--deep)}.parameter{display:grid;grid-template-columns:minmax(180px,1fr) 150px minmax(210px,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.parameter:last-child{border:0}.parameter-key{color:var(--blue);font:12px ui-monospace,monospace}.parameter-description,.form-label{color:var(--muted);font-size:11px}.form-label{display:block;margin-bottom:4px}.reasoning{margin-top:9px}.actions{display:grid;grid-template-columns:220px minmax(0,1fr);gap:10px}.modal{position:fixed;inset:0;z-index:20;display:grid;grid-template-rows:auto 1fr;background:#000e}.modal-head{display:flex;justify-content:flex-end;padding:10px}.modal-stage{display:grid;overflow:auto;place-items:center;padding:16px}.modal-stage img{max-width:none}.toast{position:fixed;top:16px;right:18px;z-index:30;padding:9px 13px;border:1px solid var(--line);border-radius:7px;background:#202a39}
@media(max-width:980px){.operate-grid{grid-template-columns:1fr}.tool-picker,.parameter,.actions{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.app{grid-template-columns:1fr;grid-template-rows:170px minmax(0,1fr)}.sidebar{border-right:0;border-bottom:1px solid var(--line)}.main{height:calc(100vh - 170px)}.viewer{padding:11px}.topbar,.composer{padding:8px 10px}.brand{padding:9px}.queue{display:flex;gap:8px}.session{min-width:260px;margin:0}.hero{display:block}}
.tool-sidebar{display:flex;min-height:0;flex-direction:column;gap:7px}.tool-search-wrap{position:relative}.tool-search{width:100%;padding:8px 58px 8px 9px;border:1px solid var(--line2);border-radius:7px;background:#080d14}.tool-count{position:absolute;top:50%;right:9px;color:var(--muted);font-size:10px;transform:translateY(-50%);pointer-events:none}.record-ledger{max-width:1440px;margin:16px auto 0}.record{border-bottom:1px solid var(--line)}.record:last-child{border-bottom:0}.record>summary{display:grid;grid-template-columns:44px minmax(160px,1fr) auto auto;gap:10px;align-items:center;padding:10px 13px;cursor:pointer}.record-index{color:var(--muted);font:11px ui-monospace,monospace}.record-title{color:var(--blue);font:12px ui-monospace,monospace}.record-status{color:var(--muted);font-size:11px}.record-status.success{color:var(--accent)}.record-status.failure{color:var(--bad)}.record-turn{color:var(--muted);font-size:10px}.record-body{display:grid;grid-template-columns:minmax(240px,.8fr) minmax(0,1.2fr);gap:10px;padding:0 13px 13px}.record-block{min-width:0;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--deep)}.record-block .json{max-height:340px}@media(max-width:700px){.record>summary{grid-template-columns:34px minmax(120px,1fr) auto}.record-turn{display:none}.record-body{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-row"><div class="logo">V</div><h1>Human VLM Console</h1></div><p id="adapterLabel">Protocol-neutral operator</p></div>
    <div id="queue" class="queue"></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><div id="title" class="title">等待 provider 请求…</div><div id="subtitle" class="subtitle">Manual response console</div></div>
      <div class="top-actions"><div class="view-tabs"><button class="view-tab active" data-view="operate">操作台</button><button class="view-tab" data-view="audit">模型输入审计</button></div><a id="rawLink" class="raw-link hidden" target="_blank">Raw JSON</a></div>
    </header>
    <section id="viewer" class="viewer"><div class="empty">请求会显示在这里。</div></section>
    <section id="composer" class="composer hidden">
      <div class="composer-top"><span id="mode" class="mode"></span><div id="composerTabs" class="tabs hidden"></div><span class="spacer"></span><button id="cancel" class="btn danger">Cancel</button><button id="submit" class="btn primary">Send response</button></div>
      <div id="composerBody" class="composer-body"></div>
      <textarea id="rawResponse" class="raw-response hidden" spellcheck="false"></textarea>
    </section>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="modal-head"><button id="closeModal" class="btn">Close</button></div><div class="modal-stage"><img id="modalImage" alt="Full-size image"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="/manual-vlm-console.js"></script>
</body>
</html>
